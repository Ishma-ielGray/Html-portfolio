<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sun Eco Travel Agency</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      width: 990px;
      margin: auto;
      color: white;
    }

   /* Header */
.hd {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: aqua;
  padding: 10px 20px;
}
.hd img {
  height: 100px;
}
.hd .contact {
  text-align: right;
}
.search-box {
  margin-top: 5px;
}
.search-box input {
  padding: 5px;
}
.search-box button {
  padding: 5px 10px;
  background: #ffeb99;
  border: 1px solid #ccc;
  cursor: pointer;
}

    /* Navigation */
.nav {
  background: orange;
  text-align: center;
  height: 70px;   /* fixed height */
  display: flex;
  justify-content: center;
  align-items: center;
}

.nav ul {
  display: flex;
  list-style: none;
  margin: 0;
  padding: 0;
}

.nav ul li {
  margin: 0 20px;
}

.nav ul li a {
  text-decoration: none;
  color: white;
  font-size: 18px;
  display: block;
  line-height: 40px;   /* keeps text centered */
  padding: 10px 15px;  /* equal padding for all links */
  border-radius: 5px;
}

/* Active tab */
.nav ul li.active a {
  background: red;
}

    /* Hero Banner */
    .hero {
      width: 100%;
      position: relative;
    }

    .hero img {
      width: 990px;
      height: 250px;
      display: block;
    }

    .hero button {
      position: absolute;
      bottom: 20px;
      right: 40px;
      background: yellow;
      padding: 8px 12px;
      border: none;
      font-weight: bold;
      cursor: pointer;
    }

    /* Gallery */
    .gallery {
      display: flex;
      justify-content: space-between;
      margin-top: 20px;
    }

    .gallery img {
      width: 320px;
      height: 250px;
      border-radius: 5px;
    }

    /* Footer */
    .fot {
      width: 100%;
      height: 65px;
      background: aqua;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin-top: 20px;
    }

    .fot .links {
      display: flex;
      justify-content: center;
      margin-bottom: 5px;
    }

    .fot .links div {
      margin: 0 15px;
      color: white;
      font-weight: bold;
    }

    .fot p {
      color: white;
      font-size: 14px;
    }
   

* {box-sizing: border-box;}
body {font-family: Verdana, sans-serif;}
.mySlides {display: none;}
img {vertical-align: middle;}

/* Slideshow container */
.slideshow-container {
  max-width: 1000px;
  position: relative;
  margin: auto;
}

/* Caption text */
.text {
  color: #f2f2f2;
  font-size: 15px;
  padding: 8px 12px;
  position: absolute;
  bottom: 8px;
  width: 100%;
  text-align: center;
}

/* Number text (1/3 etc) */
.numbertext {
  color: #f2f2f2;
  font-size: 12px;
  padding: 8px 12px;
  position: absolute;
  top: 0;
}

/* The dots/bullets/indicators */
.dot {
  height: 15px;
  width: 15px;
  margin: 0 2px;
  background-color: #bbb;
  border-radius: 50%;
  display: inline-block;
  transition: background-color 0.6s ease;
}

.active {
  background-color: #717171;
}

/* Fading animation */
.fade {
  animation-name: fade;
  animation-duration: 1.5s;
}

@keyframes fade {
  from {opacity: .4} 
  to {opacity: 1}
}

/* On smaller screens, decrease text size */
@media only screen and (max-width: 300px) {
  .text {font-size: 11px}
}

  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="hd">
      <img src="Homepage/Logo1.png" alt="logo">
      <div class="contact">
        <p>Contact Us: <br><strong>062 598 7348</strong></p>

        <!-- Search Box -->
    <div class="search-box">
      <input type="text" placeholder="Search...">
        <button>Search</button>
    </div>
  </div>
</div>

    <!-- Navigation -->
    <nav class="nav">
      <ul>
        <li class="active"><a href="Homepage.html">home</a></li>
        <li><a href="Pricingpage.html  ">pricing</a></li>
        <li><a href="AboutUspage.html">about us</a></li>
        <li><a href="Gallerypage.html">gallery</a></li>
        <li><a href="Contactuspage.html">contact us</a></li>
      </ul>
    </nav>

    

    <!-- Hero Banner -->
    <h2>Automatic Slideshow</h2>
<p>Change image every 2 seconds:</p>

<div class="slideshow-container">

<div class="mySlides fade">
  <div class="numbertext">1 / 3</div>
  <img src="Homepage/travelbanner01.jpg" style="width:100%">
  <div class="text">TRAVEL NOW</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">2 / 3</div>
  <img src="Homepage/travelbanner02.jpg" style="width:100%">
  <div class="text">Paris, France</div>
</div>

<div class="mySlides fade">
  <div class="numbertext">3 / 3</div>
  <img src="Homepage/travelbanner03.jpg" style="width:100%">
  <div class="text">Tokyo, Japan</div>
</div>

</div>
<br>

<div style="text-align:center">
  <span class="dot"></span> 
  <span class="dot"></span> 
  <span class="dot"></span> 
</div>

<script>
let slideIndex = 0;
showSlides();

function showSlides() {
  let i;
  let slides = document.getElementsByClassName("mySlides");
  let dots = document.getElementsByClassName("dot");
  for (i = 0; i < slides.length; i++) {
    slides[i].style.display = "none";  
  }
  slideIndex++;
  if (slideIndex > slides.length) {slideIndex = 1}    
  for (i = 0; i < dots.length; i++) {
    dots[i].className = dots[i].className.replace(" active", "");
  }
  slides[slideIndex-1].style.display = "block";  
  dots[slideIndex-1].className += " active";
  setTimeout(showSlides, 2000); // Change image every 2 seconds
}
</script>
    <!-- Gallery -->
    <div class="gallery">
      <img src="Homepage/paris.jpg.jpg" alt="Paris">
      <img src="Homepage/beach island.png" alt="Beach">
      <img src="Homepage/mauritius_island.jpg" alt="Island">
    </div>

    <!-- Footer -->
    <div class="fot">
      <div class="links">
        <div>Home</div>
        <div>Pricing</div>
        <div>About Us</div>
        <div>Gallery</div>
        <div>Contact Us</div>
      </div>
      <p>copyright Sun Eco. Travel 2025</p>
    </div>
  </div>
</body>

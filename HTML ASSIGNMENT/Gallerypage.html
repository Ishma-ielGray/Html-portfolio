<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sun Eco Travel Agency</title>
  <style>
/* General reset */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}
body {
  font-family: Arial, sans-serif;
}

/* Container */
.container {
  width: 100%;
  margin: 0 auto;
}

/* Header */
.hd {
  width: 1000px;
  margin: 0 auto;
  background: #00e5ee; /* aqua background */
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px;
}
.hd img {
  width: 120px;
}
.contact {
  text-align: right;
}
.contact p {
  font-size: 14px;
  margin-bottom: 5px;
}
.search-box {
  display: flex;
}
.search-box input {
  padding: 5px;
  border: 1px solid #ccc;
}
.search-box button {
  background: #ffeb3b;
  border: none;
  padding: 5px 10px;
  cursor: pointer;
}

/* Navigation bar */
.nav {
    width: 1000px;
  margin: 0 auto;
  background: #e6891d;
}
.nav ul {
  display: flex;
  justify-content: center;
  list-style: none;
}
.nav ul li {
  padding: 15px 25px;
  border-right: 2px solid white;
}
.nav ul li:last-child {
  border-right: none;
}
.nav ul li a {
  color: white;
  font-size: 20px;
  text-decoration: none;
}
.nav ul li.active a {
  background: linear-gradient(to bottom, #ff0000, #aa0000);
  padding: 3px 8px;
  border-radius: 3px;
}

/* Gallery grid */
.gallery {
    width: 1050px;
  margin: 0 auto;
  padding: 20px 30px;
}
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 15px;
}
.gallery-grid img {
  width: 100%;
  height: 250px;
  object-fit: cover;
  border-radius: 2px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
}

/* Footer */
.fot {
    width: 1000px;
  margin: 0 auto;
  background: #00e5ee;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
}
.fot ul {
  display: flex;
  list-style: none;
}
.fot ul li {
  margin-right: 20px;
}
.fot ul li a {
  color: white;
  text-decoration: none;
  font-size: 18px;
}
.fot p {
  color: white;
  font-size: 16px;
}

  </style>
  </head>
